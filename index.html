<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中建八局文旅博览公司 · 工程造价数据管理平台</title>
<link rel="icon" type="image/png" href="./app/favicon.png" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }

  /* 背景轮播 */
  .bg-slider {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 0;
  }
  .bg-slide {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity 1.5s ease-in-out;
  }
  .bg-slide.active { opacity: 1; }
  .bg-overlay {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(135deg, rgba(0, 20, 50, 0.6) 0%, rgba(0, 40, 80, 0.5) 100%);
    z-index: 1;
  }

  /* 主容器：左右分栏 */
  .main-container {
    position: relative; z-index: 2;
    display: flex; width: 100%; height: 100vh;
  }

  /* 左侧品牌区 */
  .brand-section {
    flex: 1; display: flex; flex-direction: column;
    justify-content: space-between; padding: 50px 60px;
    color: #fff;
  }
  .brand-header { display: flex; align-items: center; gap: 14px; }
  .brand-logo { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; }
  .brand-title { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .brand-subtitle { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 3px; }

  .brand-content { max-width: 560px; }
  .brand-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 16px; border-radius: 20px;
    background: rgba(255,255,255,0.12); backdrop-filter: blur(10px);
    font-size: 13px; color: rgba(255,255,255,0.9); margin-bottom: 28px;
  }
  .brand-tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #f5c542; }
  .brand-headline { font-size: 56px; font-weight: 800; line-height: 1.2; margin-bottom: 24px; }
  .brand-headline .text-gold { color: #f5c542; display: block; }
  .brand-desc {
    font-size: 15px; line-height: 1.8; color: rgba(255,255,255,0.8);
    margin-bottom: 36px;
  }
  .brand-features { display: flex; gap: 14px; flex-wrap: wrap; }
  .feature-item {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 8px;
    background: rgba(255,255,255,0.08); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 14px; color: rgba(255,255,255,0.9);
  }
  .feature-item .icon { font-size: 16px; }

  .brand-footer {
    font-size: 13px; color: rgba(255,255,255,0.5);
    display: flex; gap: 24px;
  }

  /* 右侧登录区 */
  .login-section {
    width: 520px; display: flex; align-items: center; justify-content: center;
    padding: 40px;
  }
  .login-card {
    width: 100%; max-width: 420px;
    background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 16px; padding: 40px 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .login-header { text-align: center; margin-bottom: 28px; }
  .login-title { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 8px; }
  .login-subtitle { font-size: 13px; color: rgba(255,255,255,0.6); }

  /* 登录方式Tab */
  .login-tabs {
    display: flex; background: rgba(255,255,255,0.08);
    border-radius: 10px; padding: 4px; margin-bottom: 24px;
  }
  .login-tab {
    flex: 1; padding: 10px 0; text-align: center;
    font-size: 14px; color: rgba(255,255,255,0.6);
    background: transparent; border: none; border-radius: 8px;
    cursor: pointer; transition: all 0.2s;
  }
  .login-tab.active {
    background: #2563eb; color: #fff; font-weight: 600;
    box-shadow: 0 4px 12px rgba(37,99,235,0.4);
  }

  /* 表单 */
  .form-group { margin-bottom: 18px; }
  .form-label {
    display: block; font-size: 13px; color: rgba(255,255,255,0.8);
    margin-bottom: 8px; font-weight: 500;
  }
  .input-wrapper { position: relative; }
  .input-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 16px; opacity: 0.5;
  }
  .input-icon-right {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    font-size: 16px; opacity: 0.5; cursor: pointer;
  }
  .form-input {
    width: 100%; padding: 12px 14px 12px 42px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px; font-size: 14px; color: #fff;
    outline: none; transition: all 0.2s;
  }
  .form-input::placeholder { color: rgba(255,255,255,0.4); }
  .form-input:focus {
    border-color: #3b82f6; background: rgba(255,255,255,0.12);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
  }

  .code-input-group { display: flex; gap: 10px; }
  .code-input-group .form-input { flex: 1; }
  .code-btn {
    padding: 0 16px; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
    color: rgba(255,255,255,0.8); font-size: 13px; cursor: pointer;
    white-space: nowrap; transition: all 0.2s;
  }
  .code-btn:hover { background: rgba(255,255,255,0.15); }
  .code-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 登录选项 */
  .login-options {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .remember-me {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: rgba(255,255,255,0.7); cursor: pointer;
  }
  .remember-me input { accent-color: #3b82f6; }
  .forgot-password {
    font-size: 13px; color: #f5c542; text-decoration: none;
  }
  .forgot-password:hover { text-decoration: underline; }

  /* 登录按钮 */
  .login-btn {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; color: #fff;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(37,99,235,0.4);
  }
  .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.5); }

  /* 注册入口 */
  .register-entry { text-align: center; margin-top: 18px; }
  .register-link {
    font-size: 13px; color: rgba(255,255,255,0.6); cursor: pointer;
  }
  .register-link:hover { color: #fff; text-decoration: underline; }

  /* 分割线 */
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 24px 0 18px;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: rgba(255,255,255,0.15);
  }
  .divider span { font-size: 12px; color: rgba(255,255,255,0.4); }

  /* 管理员入口按钮 */
  .admin-entry-btn {
    width: 100%; padding: 11px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
    font-size: 14px; color: rgba(255,255,255,0.8);
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .admin-entry-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .admin-icon { font-size: 16px; }

  /* 提示消息 */
  .tip-message {
    padding: 10px 14px; border-radius: 8px; font-size: 13px;
    margin-bottom: 16px; display: none;
  }
  .tip-message.show { display: block; }
  .tip-message.error { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
  .tip-message.success { background: rgba(34,197,94,0.15); color: #86efac; border: 1px solid rgba(34,197,94,0.3); }
  .tip-message.info { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }

  /* 面板切换 */
  .user-panel { display: block; }
  .user-panel.hidden { display: none; }
  .admin-panel { display: none; }
  .admin-panel.active { display: block; }
  .register-panel { display: none; }
  .register-panel.active { display: block; }

  .back-link {
    display: inline-flex; align-items: center; gap: 4px;
    color: rgba(255,255,255,0.6); font-size: 13px;
    cursor: pointer; margin-bottom: 20px;
  }
  .back-link:hover { color: #fff; }

  /* 轮播指示器 */
  .carousel-indicators {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10;
  }
  .indicator {
    width: 24px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.3s;
  }
  .indicator.active { background: #f5c542; width: 32px; }

  /* 响应式 */
  @media (max-width: 1024px) {
    .brand-section { display: none; }
    .login-section { width: 100%; }
  }
  @media (max-width: 480px) {
    .login-section { padding: 20px; }
    .login-card { padding: 30px 24px; }
    .brand-headline { font-size: 40px; }
  }
</style>
</head>
<body>

<!-- 背景轮播 -->
<div class="bg-slider" id="bgSlider">
  <div class="bg-slide active" style="background-image: url('landing-assets/bg/01-nianhuawan-panorama.jpg');"></div>
  <div class="bg-slide" style="background-image: url('landing-assets/bg/02-nianhuawan-aerial.jpg');"></div>
  <div class="bg-slide" style="background-image: url('landing-assets/bg/03-niushou-sunset.jpg');"></div>
  <div class="bg-slide" style="background-image: url('landing-assets/bg/04-wuxi-olympic-aerial.jpg');"></div>
  <div class="bg-slide" style="background-image: url('landing-assets/bg/05-wuxi-olympic-night.jpg');"></div>
  <div class="bg-slide" style="background-image: url('landing-assets/bg/06-garden-expo-aerial.jpg');"></div>
</div>
<div class="bg-overlay"></div>

<!-- 主容器 -->
<div class="main-container">
  <!-- 左侧品牌区 -->
  <div class="brand-section">
    <div class="brand-header">
      <img src="app/favicon.png" class="brand-logo" alt="CSCEC" />
      <div>
        <div class="brand-title">工程造价数据管理平台</div>
        <div class="brand-subtitle">中建八局文旅博览 · 商务管理部</div>
      </div>
    </div>

    <div class="brand-content">
      <div class="brand-tag">工程造价 · 数据管理平台</div>
      <h1 class="brand-headline">
        铸造精品
        <span class="text-gold">文旅博览</span>
      </h1>
      <p class="brand-desc">
        基于工程造价数据管理标准，以数字化方式呈现清单定额、材料价格、案例指标，
        助力商务人员快速掌握造价要点，提升项目履约品质。
      </p>
      <div class="brand-features">
        <div class="feature-item"><span class="icon">📊</span> 清单定额管理</div>
        <div class="feature-item"><span class="icon">💰</span> 材料价格参考</div>
        <div class="feature-item"><span class="icon">📈</span> 案例指标分析</div>
      </div>
    </div>

    <div class="brand-footer">
      <span>© 2026 中建八局文旅博览投资发展有限公司</span>
      <span>技术支持：信息化中心</span>
    </div>
  </div>

  <!-- 右侧登录区 -->
  <div class="login-section">
    <div class="login-card">
      <!-- 用户登录面板 -->
      <div class="user-panel" id="userPanel">
        <div class="login-header">
          <div class="login-title">欢迎登录</div>
          <div class="login-subtitle">请使用您的账号登录工程造价数据管理平台</div>
        </div>

        <div class="login-tabs">
          <button class="login-tab active" data-mode="account" onclick="switchLoginMode('account')">账号密码登录</button>
          <button class="login-tab" data-mode="phone" onclick="switchLoginMode('phone')">手机/邮箱登录</button>
        </div>

        <div class="tip-message" id="tipMessage"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <!-- 账号密码登录 -->
          <div id="accountLogin">
            <div class="form-group">
              <label class="form-label">用户名</label>
              <div class="input-wrapper">
                <span class="input-icon">👤</span>
                <input type="text" class="form-input" id="usernameInput" placeholder="请输入用户名" />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">密码</label>
              <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input type="password" class="form-input" id="passwordInput" placeholder="请输入密码" />
                <span class="input-icon-right" onclick="togglePassword()">👁</span>
              </div>
            </div>
          </div>

          <!-- 手机/邮箱登录 -->
          <div id="phoneLogin" style="display: none;">
            <div class="form-group">
              <label class="form-label">手机号/邮箱</label>
              <div class="input-wrapper">
                <span class="input-icon">📱</span>
                <input type="text" class="form-input" id="accountInput" placeholder="请输入手机号或邮箱" />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">验证码</label>
              <div class="code-input-group">
                <input type="text" class="form-input" id="codeInput" placeholder="请输入验证码" maxlength="6" style="padding-left: 14px;" />
                <button type="button" class="code-btn" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
              </div>
            </div>
          </div>

          <div class="login-options">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe" /> 记住我
            </label>
            <a href="#" class="forgot-password" onclick="event.preventDefault(); showTip('请联系管理员重置密码', 'info');">忘记密码？</a>
          </div>

          <button type="submit" class="login-btn">登 录 →</button>
        </form>

        <div class="register-entry">
          <span class="register-link" onclick="showRegisterPanel()">没有账号？立即注册</span>
        </div>

        <div class="divider"><span>其他入口</span></div>

        <button class="admin-entry-btn" onclick="showAdminPanel()">
          <span class="admin-icon">🛡</span> 管理员入口
        </button>
      </div>

      <!-- 管理员登录面板 -->
      <div class="admin-panel" id="adminPanel">
        <span class="back-link" onclick="showUserPanel()">← 返回用户登录</span>
        <div class="login-header">
          <div class="login-title">管理员登录</div>
          <div class="login-subtitle">仅限系统管理员使用</div>
        </div>
        <div class="tip-message" id="adminTipMessage"></div>
        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
          <div class="form-group">
            <label class="form-label">管理员账号</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input type="text" class="form-input" id="adminAccount" placeholder="请输入管理员账号" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">管理员密码</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" class="form-input" id="adminPassword" placeholder="请输入管理员密码" />
            </div>
          </div>
          <button type="submit" class="login-btn" style="margin-top: 10px;">管理员登录 →</button>
        </form>
      </div>

      <!-- 注册面板 -->
      <div class="register-panel" id="registerPanel">
        <span class="back-link" onclick="showUserPanel()">← 返回登录</span>
        <div class="login-header">
          <div class="login-title">用户注册</div>
          <div class="login-subtitle">创建您的账号</div>
        </div>
        <div class="tip-message" id="registerTipMessage"></div>
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label class="form-label">注册方式</label>
            <div class="login-tabs">
              <button type="button" class="login-tab active" data-reg-type="phone" onclick="switchRegType('phone')">手机号注册</button>
              <button type="button" class="login-tab" data-reg-type="email" onclick="switchRegType('email')">邮箱注册</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" id="regAccountLabel">手机号</label>
            <div class="input-wrapper">
              <span class="input-icon">📱</span>
              <input type="text" class="form-input" id="regAccountInput" placeholder="请输入手机号" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">设置密码</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" class="form-input" id="regPasswordInput" placeholder="请设置密码（至少6位）" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">确认密码</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" class="form-input" id="regConfirmPasswordInput" placeholder="请再次输入密码" />
            </div>
          </div>
          <button type="submit" class="login-btn" style="margin-top: 10px;">注 册 →</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- 轮播指示器 -->
<div class="carousel-indicators" id="carouselIndicators">
  <span class="indicator active" onclick="goToSlide(0)"></span>
  <span class="indicator" onclick="goToSlide(1)"></span>
  <span class="indicator" onclick="goToSlide(2)"></span>
  <span class="indicator" onclick="goToSlide(3)"></span>
  <span class="indicator" onclick="goToSlide(4)"></span>
  <span class="indicator" onclick="goToSlide(5)"></span>
</div>

<script>
  // ===== 用户系统工具函数 =====
  function getAllUsers() { return JSON.parse(localStorage.getItem('cscec_users') || '{}'); }
  function saveUser(account, data) {
    const users = getAllUsers();
    users[account] = { ...users[account], ...data };
    localStorage.setItem('cscec_users', JSON.stringify(users));
  }
  function logOperation(account, action, detail = '') {
    const logs = JSON.parse(localStorage.getItem('cscec_operation_logs') || '[]');
    logs.unshift({ id: Date.now(), account, action, detail, timestamp: new Date().toLocaleString('zh-CN') });
    if (logs.length > 500) logs.length = 500;
    localStorage.setItem('cscec_operation_logs', JSON.stringify(logs));
  }
  (function initAdmin() {
    const users = getAllUsers();
    if (!users['admin']) {
      users['admin'] = { account: 'admin', password: 'admin123', phone: '', email: '', role: 'admin', createdAt: new Date().toLocaleString('zh-CN'), lastLogin: '' };
      localStorage.setItem('cscec_users', JSON.stringify(users));
    }
  })();

  // 背景轮播
  let currentSlide = 0;
  const slides = document.querySelectorAll('.bg-slide');
  const indicators = document.querySelectorAll('.indicator');
  function goToSlide(index) {
    slides[currentSlide].classList.remove('active');
    indicators[currentSlide].classList.remove('active');
    currentSlide = index;
    slides[currentSlide].classList.add('active');
    indicators[currentSlide].classList.add('active');
  }
  setInterval(() => { goToSlide((currentSlide + 1) % slides.length); }, 5000);

  // 登录状态
  let loginMode = 'account'; // account / phone
  let regType = 'phone';
  let generatedCode = '';

  // 切换登录方式
  function switchLoginMode(mode) {
    loginMode = mode;
    document.querySelectorAll('.login-tab[data-mode]').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.mode === mode);
    });
    document.getElementById('accountLogin').style.display = mode === 'account' ? 'block' : 'none';
    document.getElementById('phoneLogin').style.display = mode === 'phone' ? 'block' : 'none';
  }

  // 切换注册方式
  function switchRegType(type) {
    regType = type;
    document.querySelectorAll('.login-tab[data-reg-type]').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.regType === type);
    });
    const label = document.getElementById('regAccountLabel');
    const input = document.getElementById('regAccountInput');
    if (type === 'phone') { label.textContent = '手机号'; input.placeholder = '请输入手机号'; }
    else { label.textContent = '邮箱'; input.placeholder = '请输入邮箱'; }
  }

  // 显示提示
  function showTip(msg, type = 'info') {
    const tip = document.getElementById('tipMessage');
    tip.textContent = msg; tip.className = 'tip-message show ' + type;
  }
  function showAdminTip(msg, type = 'info') {
    const tip = document.getElementById('adminTipMessage');
    tip.textContent = msg; tip.className = 'tip-message show ' + type;
  }
  function showRegisterTip(msg, type = 'info') {
    const tip = document.getElementById('registerTipMessage');
    tip.textContent = msg; tip.className = 'tip-message show ' + type;
  }

  // 密码显示切换
  function togglePassword() {
    const input = document.getElementById('passwordInput');
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  // 发送验证码
  function sendCode() {
    const account = document.getElementById('accountInput').value.trim();
    if (!account) { showTip('请先输入手机号或邮箱', 'error'); return; }
    generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
    showTip('验证码已发送：' + generatedCode + '（演示环境，验证码直接显示）', 'info');
    const btn = document.getElementById('sendCodeBtn');
    let count = 60; btn.disabled = true; btn.textContent = count + 's后重发';
    const timer = setInterval(() => {
      count--; btn.textContent = count + 's后重发';
      if (count <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; }
    }, 1000);
  }

  // 用户登录
  function handleLogin(e) {
    e.preventDefault();
    const now = new Date().toLocaleString('zh-CN');
    let account = '';

    if (loginMode === 'account') {
      account = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      if (!account) { showTip('请输入用户名', 'error'); return; }
      if (!password) { showTip('请输入密码', 'error'); return; }
      const users = getAllUsers();
      if (users[account] && users[account].password) {
        if (users[account].password !== password) { showTip('密码错误', 'error'); return; }
      } else {
        if (!users[account]) {
          saveUser(account, { account, password, role: 'user', createdAt: now, phone: '', email: '' });
        } else {
          saveUser(account, { password });
        }
      }
    } else {
      account = document.getElementById('accountInput').value.trim();
      const code = document.getElementById('codeInput').value.trim();
      if (!account) { showTip('请输入手机号或邮箱', 'error'); return; }
      if (!generatedCode) { showTip('请先获取验证码', 'error'); return; }
      if (code !== generatedCode) { showTip('验证码错误', 'error'); return; }
      const users = getAllUsers();
      if (!users[account]) {
        saveUser(account, { account, password: '', role: 'user', createdAt: now, phone: account.includes('@') ? '' : account, email: account.includes('@') ? account : '' });
      }
    }

    saveUser(account, { lastLogin: now });
    localStorage.setItem('cscec_logged_in', 'true');
    localStorage.setItem('cscec_account', account);
    localStorage.setItem('cscec_role', 'user');
    logOperation(account, '用户登录', loginMode === 'account' ? '账号密码登录' : '手机/邮箱登录');
    showTip('登录成功，正在跳转...', 'success');
    setTimeout(() => { window.location.href = './app/'; }, 1000);
  }

  // 管理员登录
  function handleAdminLogin(e) {
    e.preventDefault();
    const account = document.getElementById('adminAccount').value.trim();
    const password = document.getElementById('adminPassword').value;
    const users = getAllUsers();
    const now = new Date().toLocaleString('zh-CN');
    const adminUser = users[account];
    if (adminUser && adminUser.role === 'admin' && adminUser.password === password) {
      saveUser(account, { lastLogin: now });
      localStorage.setItem('cscec_logged_in', 'true');
      localStorage.setItem('cscec_account', account);
      localStorage.setItem('cscec_role', 'admin');
      logOperation(account, '管理员登录', '');
      showAdminTip('管理员登录成功，正在跳转...', 'success');
      setTimeout(() => { window.location.href = './app/'; }, 1000);
    } else {
      showAdminTip('管理员账号或密码错误（提示：admin / admin123）', 'error');
    }
  }

  // 面板切换
  function showAdminPanel() {
    document.getElementById('userPanel').classList.add('hidden');
    document.getElementById('registerPanel').classList.remove('active');
    document.getElementById('adminPanel').classList.add('active');
  }
  function showRegisterPanel() {
    document.getElementById('userPanel').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('active');
    document.getElementById('registerPanel').classList.add('active');
  }
  function showUserPanel() {
    document.getElementById('userPanel').classList.remove('hidden');
    document.getElementById('adminPanel').classList.remove('active');
    document.getElementById('registerPanel').classList.remove('active');
  }

  // 用户注册
  function handleRegister(e) {
    e.preventDefault();
    const account = document.getElementById('regAccountInput').value.trim();
    const password = document.getElementById('regPasswordInput').value;
    const confirmPassword = document.getElementById('regConfirmPasswordInput').value;
    const users = getAllUsers();
    const now = new Date().toLocaleString('zh-CN');

    if (!account) { showRegisterTip('请输入' + (regType === 'phone' ? '手机号' : '邮箱'), 'error'); return; }
    if (regType === 'phone' && !/^1\d{10}$/.test(account)) { showRegisterTip('请输入正确的手机号', 'error'); return; }
    if (regType === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(account)) { showRegisterTip('请输入正确的邮箱', 'error'); return; }
    if (!password || password.length < 6) { showRegisterTip('密码至少6位', 'error'); return; }
    if (password !== confirmPassword) { showRegisterTip('两次输入的密码不一致', 'error'); return; }
    if (users[account]) { showRegisterTip('该账号已注册，请直接登录', 'error'); return; }

    saveUser(account, { account, password, role: 'user', createdAt: now, lastLogin: '', phone: regType === 'phone' ? account : '', email: regType === 'email' ? account : '' });
    logOperation(account, '用户注册', regType === 'phone' ? '手机号注册' : '邮箱注册');
    showRegisterTip('注册成功，正在跳转登录...', 'success');
    setTimeout(() => {
      showUserPanel();
      switchLoginMode('account');
      document.getElementById('usernameInput').value = account;
    }, 1500);
  }

  // 如果已登录，直接跳转
  if (localStorage.getItem('cscec_logged_in') === 'true') {
    window.location.href = './app/';
  }
</script>

</body>
</html>
